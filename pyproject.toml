[project]
name = "python-for-ai-masterclass"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dash>=4.4.1",
    "ipykernel>=6,<7",
    "jupyter-console>=6.6.3",
    "jupyterlab>=4,<5",
    "matplotlib>=3.8,<4",
    "nbclassic>=1.3.3",
    "notebook>=7.6.2",
    "numpy>=2.0,<3",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "statsmodels>=0.15.0",
    "torch>=2.14.0",
]

[project.scripts]
python-for-ai-masterclass = "python_for_ai_masterclass:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "Projects",
]
